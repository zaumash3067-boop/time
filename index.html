<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мій таймер</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="time">
      <p id="hours" class="text-time">00</p>
      <p class="text-time">:</p>
      <p id="minutes" class="text-time">00</p>
      <p class="text-time">:</p>
      <p id="seconds" class="text-time">00</p>
    </div>
    <div id="div-button">
      <div id="start-continue" class="button">Старт</div>
      <div id="stop" class="button">Стоп</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
